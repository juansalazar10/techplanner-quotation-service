spring.application.name=quotation-service
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:quotationdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
recommendation.lib.executable=/app/recommendation-lib.exe
recommendation.lib.timeout-seconds=${RECOMMENDATION_LIB_TIMEOUT_SECONDS:30}
